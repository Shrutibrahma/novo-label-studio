[project]
name = "label-studio-agent"
version = "1.0.0"
description = "Novo Label Studio print agent (Windows): pulls jobs from the API and writes RAW ZPL to the printer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "pillow",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
labelstudio-agent = "agent.main:main"
zpl2png = "agent.zpl:cli"

[dependency-groups]
dev = [
    "pytest",
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp"
