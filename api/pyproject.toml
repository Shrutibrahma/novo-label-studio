[project]
name = "label-studio-api"
version = "1.0.0"
description = "Novo Label Studio API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "psycopg[binary]",
    "argon2-cffi",
    "python-multipart",
    "openpyxl",
    "xlrd",
    "charset-normalizer",
    "pillow",
    "segno",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers[postgres]",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "hardware: acceptance check that needs the real ZQ630 Plus",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]
