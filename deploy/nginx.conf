worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"path":"$uri","status":$status,"duration_s":$request_time}';
  access_log /dev/stdout json;

  # Plain HTTP only redirects: HTTPS only (spec section 15).
  server {
    listen 80;
    return 301 https://$host:${HTTPS_PORT_HINT}$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/labelstudio.crt;
    ssl_certificate_key /etc/nginx/certs/labelstudio.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Imports are up to 20 MB, images up to 10 MB.
    client_max_body_size 25m;

    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
