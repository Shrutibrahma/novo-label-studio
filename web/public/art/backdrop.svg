<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Sign-in / setup backdrop: engineering line art (T-slot extrusion, gear, bolts, nuts, rising bars) on brand green. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141D0E"/>
      <stop offset="0.55" stop-color="#1F2F18"/>
      <stop offset="1" stop-color="#34502A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#6E9A58" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E9A58" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9BC287" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#9BC287" stroke-opacity="0.09" stroke-width="1.5"/>
    </pattern>
    <symbol id="tslot" viewBox="-2 -2 104 104">
      <path d="M0,0 H42 V6 H30 V18 H70 V6 H58 V0 H100 V42 H94 V30 H82 V70 H94 V58 H100 V100 H58 V94 H70 V82 H30 V94 H42 V100 H0 V58 H6 V70 H18 V30 H6 V42 H0 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="36" y="36" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M18 18 L36 36 M82 18 L64 36 M18 82 L36 64 M82 82 L64 64" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
    <symbol id="nut" viewBox="-52 -52 104 104">
      <polygon points="50,0 25,43.3 -25,43.3 -50,0 -25,-43.3 25,-43.3" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle r="40" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5"/>
      <circle r="24" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle r="19" fill="none" stroke="currentColor" stroke-width="1"/>
    </symbol>
    <symbol id="gear" viewBox="-110 -110 220 220">
      <circle r="92" fill="none" stroke="currentColor" stroke-width="18" stroke-dasharray="16 12.9"/>
      <circle r="82" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle r="34" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle r="14" fill="none" stroke="currentColor" stroke-width="2"/>
      <g fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="0" cy="-58" r="10"/><circle cx="50.2" cy="-29" r="10"/><circle cx="50.2" cy="29" r="10"/>
        <circle cx="0" cy="58" r="10"/><circle cx="-50.2" cy="29" r="10"/><circle cx="-50.2" cy="-29" r="10"/>
      </g>
    </symbol>
    <symbol id="bolt" viewBox="0 0 360 90">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M4 10 H64 V80 H4 Z"/>
        <path d="M4 30 H64 M4 60 H64"/>
        <path d="M64 27 H350 L356 33 V57 L350 63 H64"/>
      </g>
      <g stroke="currentColor" stroke-width="1.2">
        <path d="M150 27 L142 63 M162 27 L154 63 M174 27 L166 63 M186 27 L178 63 M198 27 L190 63 M210 27 L202 63 M222 27 L214 63 M234 27 L226 63 M246 27 L238 63 M258 27 L250 63 M270 27 L262 63 M282 27 L274 63 M294 27 L286 63 M306 27 L298 63 M318 27 L310 63 M330 27 L322 63 M342 27 L334 63"/>
      </g>
    </symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#B9D4AA" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#grid5)"/>

  <!-- Large extrusion profile, bottom left, with dimension lines. -->
  <g color="#A9CB97" opacity="0.30">
    <use href="#tslot" x="70" y="560" width="340" height="340"/>
  </g>
  <g stroke="#B9D4AA" stroke-width="1.2" opacity="0.35" fill="none">
    <path d="M73 520 V548 M407 520 V548"/>
    <path d="M77 532 H403" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M430 563 H458 M430 897 H458"/>
    <path d="M444 567 V893" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#B9D4AA" opacity="0.45">
    <text x="208" y="524">40.00</text>
    <text x="452" y="736" transform="rotate(90 452 736)">40.00</text>
    <text x="70" y="940">PROFILE 40x40 · T-SLOT 8</text>
  </g>

  <!-- Gear, top left, partly off canvas. -->
  <g color="#A9CB97" opacity="0.22">
    <use href="#gear" x="-120" y="-110" width="420" height="420"/>
  </g>

  <!-- Bolt, upper right. -->
  <g color="#C9DDBE" opacity="0.28">
    <use href="#bolt" x="1010" y="120" width="480" height="120"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#B9D4AA" opacity="0.45">
    <text x="1015" y="275">M8 x 1.25 — 50</text>
  </g>

  <!-- Nuts scattered. -->
  <g color="#C9DDBE" opacity="0.22">
    <use href="#nut" x="1300" y="330" width="130" height="130"/>
    <use href="#nut" x="560" y="80" width="80" height="80"/>
    <use href="#nut" x="1450" y="820" width="100" height="100"/>
  </g>
  <g color="#847F72" opacity="0.55">
    <use href="#nut" x="760" y="860" width="60" height="60"/>
  </g>

  <!-- Rising bars + arrow (the Novo mark's motif), bottom right. -->
  <g fill="none" stroke="#B9D4AA" stroke-width="2" opacity="0.30" stroke-linejoin="round">
    <rect x="1080" y="760" width="46" height="130"/>
    <rect x="1146" y="700" width="46" height="190"/>
    <rect x="1212" y="630" width="46" height="260"/>
    <path d="M1278 890 V560 H1260 L1301 500 L1342 560 H1324 V890 Z"/>
    <path d="M1050 890 H1380"/>
  </g>

  <!-- Crosshairs / centre marks. -->
  <g stroke="#B9D4AA" stroke-width="1.2" opacity="0.35" fill="none">
    <circle cx="880" cy="200" r="14"/><path d="M856 200 H904 M880 176 V224"/>
    <circle cx="640" cy="720" r="10"/><path d="M622 720 H658 M640 702 V738"/>
  </g>
</svg>
